<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KBB CLUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/index.css">
</head>
<body class="p-6 md:p-10 min-h-screen flex items-center justify-center bg-[#0b0b12]">
  <div class="w-full max-w-md glass p-8 rounded-xl">
    <h1 class="text-2xl font-bold mb-2">Sign in to KBB CLUB</h1>
    <p class="text-sm text-gray-400 mb-6">Enter your credentials to continue.</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="text-xs text-gray-400 uppercase mb-1 ml-1">Username</label>
        <input id="username" type="text" required class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none">
      </div>
      <div>
        <label class="text-xs text-gray-400 uppercase mb-1 ml-1">Password</label>
        <input id="password" type="password" required class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none">
      </div>

      <div class="flex gap-4">
        <button type="submit" class="flex-1 px-6 py-3 rounded-xl bg-purple-600 hover:bg-purple-500 transition font-bold text-white">Sign in</button>
        <button id="demoBtn" type="button" class="px-4 py-3 rounded-xl border border-white/10 text-gray-300">Use Demo</button>
      </div>
    </form>

    <div class="mt-6 text-xs text-gray-400">
      <p class="mb-2">Demo accounts (client-side only):</p>
      <ul class="list-disc ml-5 space-y-1">
        <li><strong>manager</strong> / managerpass — management</li>
        <li><strong>staff1</strong> / staffpass — staff</li>
        <li><strong>pr</strong> / prpass — pr</li>
      </ul>
    </div>
  </div>

  <script src="./script/auth.js"></script>
  <script>
    // Client-side login handling (demo only)
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const ok = login(u, p);
      if (ok) {
        // Redirect to main app
        location.href = 'index.html';
      } else {
        alert('Invalid credentials. Use a demo account listed below.');
      }
    });

    document.getElementById('demoBtn').addEventListener('click', function () {
      // Fill demo manager by default
      document.getElementById('username').value = 'manager';
      document.getElementById('password').value = 'managerpass';
      // auto submit
      form.requestSubmit();
    });

    // If already logged in, go to index
    const current = getCurrentUser();
    if (current) {
      location.href = 'index.html';
    }
  </script>
</body>
</html>
